# ---------- Server ----------
server.port=8080
server.error.include-stacktrace=never
server.error.include-message=always

# ---------- MySQL Database ----------
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/wayhome?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:wayhome_user}
spring.datasource.password=${DB_PASSWORD:WayHome@12345}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ---------- JPA / Hibernate ----------
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ---------- JWT ----------
jwt.secret=${JWT_SECRET:WayHome_LOCAL_ONLY_CHANGE_THIS_SECRET_BEFORE_DEPLOYMENT_1234567890}
jwt.expiration=${JWT_EXPIRATION:604800000}

# ---------- Frontend CORS ----------
app.frontend-url=${FRONTEND_URL:http://localhost:5173}

# ---------- Jackson ----------
spring.jackson.serialization.fail-on-empty-beans=false

# ---------- Demo seed data ----------
app.seed-demo-data=${SEED_DEMO_DATA:true}

# ---------- Brevo Transactional Email ----------
brevo.api.key=${BREVO_API_KEY:}
brevo.sender.email=${BREVO_SENDER_EMAIL:}
brevo.sender.name=${BREVO_SENDER_NAME:WayHome}

